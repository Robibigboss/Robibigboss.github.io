<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="obsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0D12" />
      <stop offset="100%" stop-color="#181D28" />
    </linearGradient>
  </defs>

  <!-- Obsidian Rounded Base with Racing Red Border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#obsBg)" stroke="#D90429" stroke-width="3" />

  <!-- Subtle Algorithm Graph & Circuit Traces in Background -->
  <g stroke="#D90429" stroke-opacity="0.35" stroke-width="1.5" fill="none">
    <path d="M10 16 H22 L26 22" />
    <path d="M54 16 H42 L38 22" />
    <path d="M10 48 H22 L26 42" />
    <path d="M54 48 H42 L38 42" />
    <circle cx="10" cy="16" r="2" fill="#D90429" />
    <circle cx="54" cy="16" r="2" fill="#D90429" />
    <circle cx="10" cy="48" r="2" fill="#D90429" />
    <circle cx="54" cy="48" r="2" fill="#D90429" />
  </g>

  <!-- Top Left: Math Pi (π) Symbol in White -->
  <text x="10" y="15" fill="#FFFFFF" font-family="Georgia, serif" font-weight="bold" font-size="12">π</text>

  <!-- Top Right: Math Square Root (√x) in White -->
  <path d="M44 11 L46.5 14.5 L51 7 H56" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Center: Arduino / ESP32 Microcontroller Chip with Pins -->
  <g stroke="#FFFFFF" stroke-width="2" stroke-linecap="round">
    <!-- Top Pins -->
    <line x1="25" y1="17" x2="25" y2="21" />
    <line x1="32" y1="17" x2="32" y2="21" />
    <line x1="39" y1="17" x2="39" y2="21" />
    <!-- Bottom Pins -->
    <line x1="25" y1="43" x2="25" y2="47" />
    <line x1="32" y1="43" x2="32" y2="47" />
    <line x1="39" y1="43" x2="39" y2="47" />
    <!-- Left Pins -->
    <line x1="17" y1="25" x2="21" y2="25" />
    <line x1="17" y1="32" x2="21" y2="32" />
    <line x1="17" y1="39" x2="21" y2="39" />
    <!-- Right Pins -->
    <line x1="43" y1="25" x2="47" y2="25" />
    <line x1="43" y1="32" x2="47" y2="32" />
    <line x1="43" y1="39" x2="47" y2="39" />
  </g>

  <!-- Microcontroller Body -->
  <rect x="21" y="21" width="22" height="22" rx="4" fill="#D90429" stroke="#FFFFFF" stroke-width="2" />

  <!-- Arduino Infinity / Dual Loop Symbol inside Chip -->
  <path
    d="M28 32 C28 29.8 24.5 29.8 24.5 32 C24.5 34.2 28 34.2 28 32 L36 32 C36 29.8 39.5 29.8 39.5 32 C39.5 34.2 36 34.2 36 32 Z"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="2"
    stroke-linecap="round"
  />

  <!-- Bottom: Algorithm / C++ Brackets { ∑ } -->
  <text x="32" y="57" text-anchor="middle" fill="#FFFFFF" font-family="monospace" font-weight="bold" font-size="10.5">{C++}</text>
</svg>
